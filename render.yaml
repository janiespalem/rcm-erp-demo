services:
  - type: web
    name: factoryflow-erp-demo
    runtime: python
    plan: free
    buildCommand: >
      cd frontend-vite && npm ci && npm run build && cd .. &&
      python3 -m pip install -r requirements.txt
    startCommand: python3 -m alembic upgrade head && cd backend && python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DISABLE_STARTUP_SEED
        value: "1"
      - key: CORS_ORIGINS
        sync: false
