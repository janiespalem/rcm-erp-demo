<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FactoryFlow - Kalkulator LEGO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{--bg:#0b0b0c;--panel:#161616;--line:#2b2b2d;--text:#f0ece5;--muted:#898989;--orange:#f97316}
*{box-sizing:border-box}body{margin:0;background:#0b0b0c;color:var(--text);font-family:Barlow,system-ui,sans-serif}
.wrap{max-width:1220px;margin:0 auto;padding:32px 22px 80px}
h1{font-size:34px;margin:0 0 8px}.lead{color:var(--muted);margin:0 0 24px;line-height:1.5}
.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;margin:12px 0 7px}
input,select{width:100%;padding:12px;border-radius:9px;border:1px solid #333;background:#101010;color:var(--text);font:15px ui-monospace,monospace}
button{margin-top:18px;width:100%;padding:13px 18px;border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:800;cursor:pointer}
button.secondary{background:#242424;border:1px solid #3a3a3a;color:var(--muted);margin-top:8px}
button.secondary:hover{border-color:var(--orange);color:#ffb071}
.fixes{display:grid;gap:8px;margin-top:12px}.fix{border:1px solid rgba(249,115,22,.28);background:rgba(249,115,22,.07);border-radius:10px;padding:10px}.fix-title{font-size:12px;color:#ffb071;margin-bottom:8px}.fix-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fix button{margin:0;padding:9px;background:#242424;border:1px solid #3a3a3a}.fix button:hover{border-color:var(--orange);color:#ffb071}
.dims{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;background:#111}.stat b{display:block;font-size:26px;color:var(--orange)}.stat span{font-size:12px;color:var(--muted)}
.stat.cost{border-color:rgba(249,115,22,.4);background:rgba(249,115,22,.06)}
.wall{margin:16px 0 24px}.wall h2{font-size:18px;margin:0 0 8px}.wall-note{font-size:12px;color:var(--muted);margin-bottom:8px}
.course{position:relative;height:34px;margin:4px 0;background:#0f0f10;border-radius:5px;overflow:hidden}
.block{position:absolute;top:3px;height:28px;border:1px solid #090909;border-radius:3px;color:#120a04;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 8px 14px rgba(255,255,255,.12), inset 0 -8px 12px rgba(0,0,0,.22)}
.b180{background:#e74c3c}.b120{background:#f39c12}.b90{background:#9b59b6;color:white}.b60{background:#95a5a6}.b240{background:#3498db}.b200{background:#2ecc71}.b160{background:#1abc9c}.b80{background:#2980b9}.b40{background:#7f8c8d;color:white}
.row-label{position:absolute;left:6px;top:9px;color:rgba(255,255,255,.35);font-size:10px;z-index:3}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}
.table td.price{color:#ffb071}.table tr.total td{color:var(--orange);font-weight:800;border-top:2px solid var(--line)}
.warn{border:1px solid rgba(249,115,22,.35);background:rgba(249,115,22,.08);color:#ffb071;border-radius:10px;padding:12px;margin-top:14px;font-size:13px;line-height:1.45}
#view3d{height:360px;border:1px solid var(--line);border-radius:14px;background:#050509;margin-bottom:16px;overflow:hidden;position:relative}
#view3d:after{content:'LPM: obracaj · scroll: zoom';position:absolute;right:12px;bottom:10px;color:rgba(255,255,255,.25);font:10px ui-monospace,monospace;pointer-events:none}
.boksy-plan{margin-bottom:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#050509;padding:16px}
.boksy-plan svg{display:block;max-width:100%}
@media(max-width:850px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.dims{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kalkulator bloczków LEGO</h1>
  <p class="lead">Układ warstw, waga, koszt. Ceny wg cennika demo cennika.</p>
  <div class="grid">
    <div class="card">
      <label>Seria</label>
      <select id="series" onchange="runCalc()">
        <option value="lego60std">LEGO 60 — bloki 60×60×(60÷180 cm) bez 90, C20/25</option>
        <option value="lego60full">LEGO 60 — bloki 60×60×(60÷240 cm) bez 90, C20/25</option>
        <option value="lego60wzor">LEGO 60 z wzorem — 60×60×(60÷180 cm), C20/25</option>
        <option value="lego80c20">LEGO 80 — bloki 80×80×(40÷160 cm), C20/25</option>
        <option value="lego80c30">LEGO 80 — bloki 80×80×(40÷160 cm), C30/37 REI240</option>
        <option value="lego4090">LEGO 40×90 — bloki 40×90×(200÷240 cm), C20/25 ⚠ brak bloku 40cm</option>
        <option value="lego40" selected>LEGO 40×40 — bloki 40×40×(40÷240 cm), C20/25 ✓ narożnik OK</option>
      </select>
      <label>Kształt</label>
      <select id="shape" onchange="onShapeChange()">
        <option value="prosta">Prosta</option>
        <option value="L">L</option>
        <option value="U">U</option>
        <option value="boksy" selected>Boksy (rząd otwartych U)</option>
      </select>

      <div id="boksy-extra">
        <label>Liczba boksów</label>
        <input id="nbox" type="number" value="8" min="1" max="50" step="1" oninput="runCalc()">
      </div>

      <div id="arch-wrap" style="display:none;border-top:1px solid #2b2b2d;margin-top:14px;padding-top:14px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--text);margin:0">
          <input type="checkbox" id="withArch" onchange="onArchToggle()" style="width:16px;height:16px;accent-color:var(--orange);flex-shrink:0">
          Dach łukowy (łuk LEGO 540×60×60 cm)
        </label>
        <div id="archPriceWrap" style="display:none">
          <label>Cena łuku / szt. (PLN netto)</label>
          <input id="archPrice" type="number" value="0" step="100" oninput="runCalc()">
        </div>
        <div id="archCountWrap" style="display:none;margin-top:8px">
          <label>Liczba łuków (szt.)</label>
          <input id="archCount" type="number" value="1" min="1" step="1" oninput="runCalc()" style="width:80px">
          <span id="archCountNote" style="font-size:11px;color:var(--muted);margin-left:6px"></span>
        </div>
      </div>

      <div class="dims">
        <div><label id="lbl0">Szerokość boksu (m)</label><input id="d0" type="number" value="5.0" step="0.1" oninput="onD0Change()"></div>
        <div><label id="lbl1">Głębokość boksu (m)</label><input id="d1" type="number" value="7.2" step="0.1" oninput="onD1Change()"></div>
        <div id="d2wrap" style="display:none"><label>Prawa <span id="d2equalNote" style="display:none;font-size:10px;color:var(--orange)">(= Lewa)</span></label><input id="d2" type="number" value="15" step="0.1" oninput="runCalc()"></div>
      </div>
      <label>Wysokość (m)</label><input id="height" type="number" value="1.6" step="0.1" oninput="runCalc()">
      <button onclick="runCalc()">Oblicz układ</button>
      <div class="warn" id="warn" style="display:none"></div>
      <div class="fixes" id="fixes"></div>
    </div>
    <div>
      <div class="summary" id="summary"></div>
      <div id="plan3d-wrap" style="display:none" class="boksy-plan"><canvas id="planCanvas"></canvas></div>
      <div id="view3d"></div>
      <div class="card" id="walls"></div>
    </div>
  </div>
</div>
<script>
const SERIES={
  lego60std: {depth:60,rowH:60,blocks:[180,120,60],   weights:{180:1.5,120:1,60:.5}},
  lego60full:{depth:60,rowH:60,blocks:[240,180,120,60],weights:{240:2,180:1.5,120:1,60:.5}},
  lego60wzor:{depth:60,rowH:60,blocks:[180,120,60],        weights:{180:1.5,120:1,60:.5}},
  lego80c20: {depth:80,rowH:80,blocks:[160,120,80,40],    weights:{160:2.3,120:1.73,80:1.15,40:.58}},
  lego80c30: {depth:80,rowH:80,blocks:[160,120,80,40],    weights:{160:2.3,120:1.73,80:1.15,40:.58}},
  lego4090:  {depth:40,rowH:90,blocks:[240,200],          weights:{240:2.07,200:1.62}},
  lego40:    {depth:40,rowH:40,blocks:[240,200,160,120,80,40],weights:{240:.92,200:.77,160:.61,120:.46,80:.31,40:.15}}
};
// Ceny netto PLN/szt wg cennika demo cennika
const PRICES={
  lego60std: {180:310,120:240,60:170},
  lego60full:{240:390,180:310,120:240,60:170},
  lego60wzor:{180:330,120:260,60:190},
  lego80c20: {160:430,120:290,80:230,40:150},
  lego80c30: {160:440,120:300,80:240,40:160},
  lego4090:  {240:390,200:360},
  lego40:    {240:250,120:180}
};
const COLORS={240:0x3498db,200:0x2ecc71,180:0xe74c3c,160:0x1abc9c,120:0xf39c12,90:0x9b59b6,80:0x2980b9,60:0x95a5a6,40:0x7f8c8d};
// Łuk dachowy: rozpiętość 5318 mm, element 600×600 mm, strzałka 521 mm, krawędź 131 mm
const ARCH={span:540,depth:60,rise:52.1,edgeH:13.1}; // w cm
const gcd=(a,b)=>b?gcd(b,a%b):a;
const seams=seq=>{let p=0,out=[];for(let i=0;i<seq.length-1;i++){p+=seq[i];out.push(p)}return out};


function onArchToggle(){
  const on=document.getElementById('withArch').checked;
  document.getElementById('archPriceWrap').style.display=on?'':'none';
  document.getElementById('archCountWrap').style.display=on?'':'none';
  const shape=document.getElementById('shape').value;
  if(on){
    if(shape==='U'){
      document.getElementById('d1').value='5.40';
      const d0val=document.getElementById('d0').value;
      const d2=document.getElementById('d2');
      d2.value=d0val; d2.readOnly=true; d2.style.opacity='0.55';
      document.getElementById('d2equalNote').style.display='';
    } else if(shape==='boksy'){
      document.getElementById('d0').value='4.20';
    }
    syncArchCount();
  } else {
    const d2=document.getElementById('d2');
    d2.readOnly=false; d2.style.opacity='';
    document.getElementById('d2equalNote').style.display='none';
  }
  runCalc();
}

function syncArchCount(){
  const shape=document.getElementById('shape').value;
  let depthCm=0;
  if(shape==='U')      depthCm=Math.round(parseFloat(document.getElementById('d0').value)*100);
  else if(shape==='boksy') depthCm=Math.round(parseFloat(document.getElementById('d1').value)*100);
  if(!depthCm) return;
  const max=Math.ceil(depthCm/ARCH.depth);
  const el=document.getElementById('archCount');
  el.max=max;
  if(parseInt(el.value)>max||!el.value) el.value=max;
  document.getElementById('archCountNote').textContent=`= ${parseInt(el.value)*ARCH.depth/100} m / max ${max}`;
}

function onD0Change(){
  const withArch=document.getElementById('withArch')?.checked;
  const shape=document.getElementById('shape').value;
  if(withArch&&shape==='U'){
    document.getElementById('d2').value=document.getElementById('d0').value;
  }
  if(withArch) syncArchCount();
  runCalc();
}

function onD1Change(){
  const withArch=document.getElementById('withArch')?.checked;
  if(withArch) syncArchCount();
  runCalc();
}

function onShapeChange(){
  const s=document.getElementById('shape').value;
  const isBoksy=s==='boksy';
  document.getElementById('boksy-extra').style.display=isBoksy?'':'none';
  document.getElementById('d2wrap').style.display=(s==='U')?'':'none';
  document.getElementById('arch-wrap').style.display=(s==='U'||s==='boksy')?'':'none';
  document.getElementById('lbl0').textContent=isBoksy?'Szerokość boksu (m)':'Lewa / A';
  document.getElementById('lbl1').textContent=isBoksy?'Głębokość boksu (m)':'Tylna / B';
  if(!isBoksy&&s!=='U'){document.getElementById('withArch').checked=false;document.getElementById('archPriceWrap').style.display='none';}
  runCalc();
}

function activeDimCount(shape){return shape==='prosta'?1:shape==='L'?2:shape==='U'?3:2}
function applyDim(id,cm){document.getElementById(id).value=(cm/100).toFixed(2).replace(/\.?0+$/,'');runCalc()}

function showFixes(raw,shape,step){
  const labels=['Lewa / A','Tylna / B','Prawa'];
  let html='';
  raw.slice(0,activeDimCount(shape)).forEach((v,i)=>{
    if(v%step===0)return;
    const down=Math.floor(v/step)*step,up=Math.ceil(v/step)*step;
    html+=`<div class="fix"><div class="fix-title">${labels[i]}: ${(v/100).toFixed(2)} m nie leży w module ${step} cm</div><div class="fix-actions"><button onclick="applyDim('d${i}',${down})">${(down/100).toFixed(2)} m</button><button onclick="applyDim('d${i}',${up})">${(up/100).toFixed(2)} m</button></div></div>`;
  });
  fixes.innerHTML=html;
}

function courseLengthIssues(shape,raw,series,step){
  const d=series.depth,issues=[];
  const add=(label,len)=>{if(len<=0||len%step!==0)issues.push(`${label}: ${(len/100).toFixed(2)} m`)};
  if(shape==='prosta'){add('Prosta',raw[0]);}
  else if(shape==='L'){add('A-narożny',raw[0]);add('A-cofnięty',raw[0]-d);add('B-narożny',raw[1]);add('B-cofnięty',raw[1]-d);}
  else if(shape==='U'){add('L/P-narożny',raw[0]);add('L/P-cofnięty',raw[0]-d);add('Tylna-narożna',raw[1]);add('Tylna-cofnięta',raw[1]-2*d);add('P-narożny',raw[2]);add('P-cofnięty',raw[2]-d);}
  return issues;
}

function optimize(len,blocks,prevAbs,offset){
  const prev=new Set(prevAbs||[]);
  const dp=Array(len+1).fill(null);dp[0]={score:0,seq:[]};
  for(let pos=0;pos<=len;pos++){
    if(!dp[pos])continue;
    for(const b of blocks){
      const next=pos+b;if(next>len)continue;
      const abs=offset+next;let penalty=0;
      if(next<len){if(prev.has(abs))penalty+=100000;}
      const edge=(pos===0||next===len)?(blocks[0]-b)*6:0;
      const score=dp[pos].score+1000+penalty+edge-b;
      if(!dp[next]||score<dp[next].score)dp[next]={score,seq:[...dp[pos].seq,b]};
    }
  }
  return dp[len]?.seq||null;
}
function makeCourse(len,blocks,prevAbs,offset){return optimize(len,blocks,prevAbs,offset)||[]}

function push(courses,key,row,offset,len,series,prev){
  if(len<=0)return prev[key]||[];
  const seq=makeCourse(len,series.blocks,prev[key]||[],offset);
  courses.push({key,row,offset,len,seq});
  prev[key]=seams(seq).map(x=>x+offset);
  return prev[key];
}

function layout(shape,raw,height,series){
  const rows=Math.ceil(height*100/series.rowH),d=series.depth,courses=[],prev={};
  for(let r=0;r<rows;r++){
    const sideOwns=r%2===1;
    if(shape==='prosta') push(courses,'prosta',r,0,raw[0],series,prev);
    else if(shape==='L'){
      const A=raw[0],B=raw[1];
      if(sideOwns){push(courses,'B',r,0,B,series,prev);push(courses,'A',r,d,Math.max(A-d,d),series,prev)}
      else{push(courses,'A',r,0,A,series,prev);push(courses,'B',r,d,Math.max(B-d,d),series,prev)}
    }else{
      const L=raw[0],B=raw[1],R=raw[2];
      if(sideOwns){push(courses,'Lewa',r,0,L,series,prev);push(courses,'Prawa',r,0,R,series,prev);push(courses,'Tylna',r,d,Math.max(B-2*d,d),series,prev)}
      else{push(courses,'Tylna',r,0,B,series,prev);push(courses,'Lewa',r,d,Math.max(L-d,d),series,prev);push(courses,'Prawa',r,d,Math.max(R-d,d),series,prev)}
    }
  }
  return courses;
}

// Boksy layout: narożniki zewnętrzne alternują jak w U (ta sama logika co layout())
// Rząd parzysty: tylna idzie na całą długość, boczne zewnętrzne = D
// Rząd nieparzysty: boczne zewnętrzne "wychodzą" za tylną o d → D+d; tylna skrócona o 2d
// Wewnętrzne przegrody (T-złącze): zawsze D — bloki przytykają do tylnej bez alternacji
function layoutBoksy(N,W,D,height,series){
  const d=series.depth;
  const backLen=N*W+(N+1)*d;
  const rows=Math.ceil(height*100/series.rowH);
  const courses=[],prev={};
  for(let r=0;r<rows;r++){
    const sideOwns=r%2===1;
    if(sideOwns){
      // boczne zewnętrzne ogibają narożnik → D+d
      push(courses,'Boczna_1',   r,0,D+d,series,prev);
      push(courses,`Boczna_${N+1}`,r,0,D+d,series,prev);
      // tylna skrócona (narożnik "zajęty" przez boczne)
      push(courses,'Tylna',r,d,Math.max(backLen-2*d,d),series,prev);
    }else{
      // tylna idzie na całą długość
      push(courses,'Tylna',r,0,backLen,series,prev);
      // boczne zewnętrzne normalnie = D
      push(courses,'Boczna_1',   r,0,D,series,prev);
      push(courses,`Boczna_${N+1}`,r,0,D,series,prev);
    }
    // wewnętrzne przegrody (T-złącze) — zawsze D, brak narożnika
    for(let i=2;i<=N;i++){
      push(courses,`Boczna_${i}`,r,0,D,series,prev);
    }
  }
  return courses;
}

function renderWall(name,courses,series){
  if(!courses.length)return'';
  const max=Math.max(...courses.map(c=>c.offset+c.len));
  let html=`<div class="wall"><h2>${name}</h2>`;
  for(const c of courses){
    html+=`<div class="course"><span class="row-label">r${c.row+1}</span>`;
    let p=c.offset;
    for(const b of c.seq){
      html+=`<div class="block b${b}" style="left:${p/max*100}%;width:${b/max*100}%">${b}</div>`;
      p+=b;
    }
    html+='</div>';
  }
  return html+'</div>';
}

// 3D engine (unchanged)
let scene,camera,renderer,controls,meshes=[];
function init3d(){
  const el=view3d;if(renderer)return;
  scene=new THREE.Scene();scene.background=new THREE.Color(0x050509);
  camera=new THREE.PerspectiveCamera(45,el.clientWidth/Math.max(el.clientHeight,1),1,100000);
  renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(el.clientWidth,el.clientHeight);el.appendChild(renderer.domElement);
  controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
  scene.add(new THREE.AmbientLight(0xffffff,.62));
  const a=new THREE.DirectionalLight(0xfff1dc,.9);a.position.set(1200,1600,900);scene.add(a);
  const b=new THREE.DirectionalLight(0xc8dcff,.35);b.position.set(-900,800,-900);scene.add(b);
  addEventListener('resize',()=>{if(!renderer)return;renderer.setSize(el.clientWidth,el.clientHeight);camera.aspect=el.clientWidth/Math.max(el.clientHeight,1);camera.updateProjectionMatrix()});
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
}

function courseToBlocks(shape,courses,series){
  const d=series.depth,rowH=series.rowH,out=[];
  const map={prosta:{axis:'x',x:0,z:0},A:{axis:'x',x:0,z:0},B:{axis:'z',x:0,z:0},
    Tylna:{axis:'x',x:0,z:0},Lewa:{axis:'z',x:0,z:0},Prawa:{axis:'z',x:null,z:0}};
  const backLen=Math.max(...courses.filter(c=>c.key==='Tylna').map(c=>c.offset+c.len),0);
  for(const c of courses){
    const cfg={...map[c.key]};
    if(c.key==='Prawa')cfg.x=Math.max(backLen-d,0);
    let p=c.offset;
    for(const len of c.seq){
      const axis=cfg.axis;
      out.push({len,row:c.row,px:axis==='x'?p:cfg.x,py:c.row*rowH,pz:axis==='z'?p:cfg.z,dx:axis==='x'?len:d,dy:rowH,dz:axis==='z'?len:d});
      p+=len;
    }
  }
  return out;
}

// Boksy: back wall along X at z=D, side walls along Z at x=i*(W+d)
function courseToBlocksBoksy(courses,series,N,W,D){
  const d=series.depth,rowH=series.rowH,out=[];
  for(const c of courses){
    if(c.key==='Tylna'){
      let p=c.offset;
      for(const len of c.seq){
        out.push({len,row:c.row,px:p,py:c.row*rowH,pz:D,dx:len,dy:rowH,dz:d});
        p+=len;
      }
    } else if(c.key.startsWith('Boczna_')){
      const idx=parseInt(c.key.split('_')[1])-1;
      const xPos=idx*(W+d);
      let p=c.offset;
      for(const len of c.seq){
        out.push({len,row:c.row,px:xPos,py:c.row*rowH,pz:p,dx:d,dy:rowH,dz:len});
        p+=len;
      }
    }
  }
  return out;
}

function drawBlocks3d(blocks){
  init3d();
  meshes.forEach(m=>{scene.remove(m);m.geometry.dispose();m.material.dispose()});meshes=[];
  const gap=2;
  let cx=0,cy=0,cz=0;
  for(const b of blocks){
    const geom=new THREE.BoxGeometry(Math.max(1,b.dx-gap),Math.max(1,b.dy-gap),Math.max(1,b.dz-gap));
    const mat=new THREE.MeshStandardMaterial({color:COLORS[b.len]||0xffffff,roughness:.78});
    const mesh=new THREE.Mesh(geom,mat);
    mesh.position.set(b.px+b.dx/2,b.py+b.dy/2,b.pz+b.dz/2);
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom),new THREE.LineBasicMaterial({color:0x050505,transparent:true,opacity:.85})));
    scene.add(mesh);meshes.push(mesh);cx+=mesh.position.x;cy+=mesh.position.y;cz+=mesh.position.z;
  }
  if(!meshes.length)return;
  const center=new THREE.Vector3(cx/meshes.length,cy/meshes.length,cz/meshes.length);
  const maxX=Math.max(...blocks.map(b=>b.px+b.dx)),maxZ=Math.max(...blocks.map(b=>b.pz+b.dz));
  const dist=Math.max(maxX,maxZ)*1.6;
  controls.target.copy(center);
  camera.position.set(center.x-dist*.45,center.y+dist*.65,center.z+dist*.9);
  camera.updateProjectionMatrix();controls.update();
}

function addArchMeshes3d(xOffset, _spanCm, depthCm, wallH, _legW){
  const spanCm=ARCH.span;     // always 540 cm — physical constraint
  const legW=60;              // always 60 cm — LEGO 60 system only
  const eH=ARCH.edgeH;        // 13.1 cm
  const rOuter=ARCH.rise;     // 52.1 cm — extrados crown rise above eH
  const rInner=34.3;          // cm — soffit crown rise above leg base
  const innerSpan=spanCm-2*legW;
  const unitD=ARCH.depth;
  const numArches=Math.ceil(depthCm/unitD);
  const segs=32;
  for(let i=0;i<numArches;i++){
    const z0=i*unitD;
    const az=Math.min(unitD, depthCm-z0);
    const shape=new THREE.Shape();
    // left leg bottom
    shape.moveTo(0, 0);
    shape.lineTo(legW, 0);
    // soffit arc: (legW,0) → crown → (spanCm-legW,0)
    for(let s=0;s<=segs;s++){
      const t=s/segs; const u=2*t-1;
      shape.lineTo(legW + t*innerSpan, rInner*(1-u*u));
    }
    // right leg
    shape.lineTo(spanCm, 0);
    shape.lineTo(spanCm, eH);
    // extrados arc: (spanCm,eH) → crown → (0,eH)
    for(let s=segs;s>=0;s--){
      const t=s/segs; const u=2*t-1;
      shape.lineTo(t*spanCm, eH + rOuter*(1-u*u));
    }
    shape.closePath();
    const geom=new THREE.ExtrudeGeometry(shape,{steps:1,depth:az,bevelEnabled:false});
    const mat=new THREE.MeshStandardMaterial({color:0xc8cfd6,roughness:0.88,metalness:0.03});
    const mesh=new THREE.Mesh(geom,mat);
    mesh.position.set(xOffset,wallH,z0);
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom),new THREE.LineBasicMaterial({color:0x222222,transparent:true,opacity:0.35})));
    scene.add(mesh);meshes.push(mesh);
  }
}

function render3d(shape,courses,series,N,W,D,raw,heightM){
  document.getElementById('view3d').style.display='';
  const blocks=shape==='boksy'
    ? courseToBlocksBoksy(courses,series,N,W,D)
    : courseToBlocks(shape,courses,series);
  drawBlocks3d(blocks);

  const withArch=document.getElementById('withArch')?.checked;
  if(!withArch)return;
  if(series.depth!==60)return;
  const archCount=parseInt(document.getElementById('archCount')?.value)||0;
  if(archCount<1)return;
  const archDepthCm=archCount*ARCH.depth;
  const wallH=Math.ceil((heightM||0)*100/series.rowH)*series.rowH;
  if(shape==='U'&&raw){
    if(raw[1]!==ARCH.span)return;
    if(raw[0]>0) addArchMeshes3d(0, ARCH.span, archDepthCm, wallH, 60);
  } else if(shape==='boksy'){
    const ARCH_INNER=ARCH.span-2*60;
    if(W!==ARCH_INNER)return;
    for(let i=0;i<=N;i++)
      addArchMeshes3d(i*(W+series.depth), ARCH.span, archDepthCm, wallH, 60);
  }
}

// Top-down SVG plan for boksy
function renderBoksyPlan(N,W,D,series){
  const d=series.depth;
  const totalX=N*W+(N+1)*d, totalZ=D+d;
  const maxW=700, maxH=220;
  const scale=Math.min(maxW/totalX, maxH/totalZ, 1);
  const svgW=Math.round(totalX*scale), svgH=Math.round(totalZ*scale);
  let svg=`<svg width="${svgW}" height="${svgH}" style="max-width:100%;height:auto" viewBox="0 0 ${svgW} ${svgH}">`;
  // back wall
  svg+=`<rect x="0" y="${Math.round(D*scale)}" width="${svgW}" height="${Math.round(d*scale)}" fill="#f97316" opacity=".75"/>`;
  // side walls
  for(let i=0;i<=N;i++){
    const x=Math.round(i*(W+d)*scale);
    svg+=`<rect x="${x}" y="0" width="${Math.round(d*scale)}" height="${svgH}" fill="#f97316" opacity=".75"/>`;
  }
  // box labels
  for(let i=0;i<N;i++){
    const bx=Math.round((i*(W+d)+d+W/2)*scale);
    const by=Math.round(D/2*scale);
    const area=((W/100)*(D/100)).toFixed(0);
    svg+=`<text x="${bx}" y="${by-8}" text-anchor="middle" fill="#f0ece5" font-size="14" font-family="Barlow,system-ui,sans-serif" font-weight="700">B${i+1}</text>`;
    svg+=`<text x="${bx}" y="${by+10}" text-anchor="middle" fill="#898989" font-size="11" font-family="Barlow,system-ui,sans-serif">${area} m²</text>`;
  }
  svg+='</svg>';
  return svg;
}

function countBlocks(courses,series,seriesKey){
  const prices=PRICES[seriesKey]||{};
  const counts={};let qty=0,totalW=0,totalCost=0,hasPrices=false;
  courses.forEach(c=>c.seq.forEach(b=>{
    counts[b]=(counts[b]||0)+1;qty++;
    totalW+=series.weights[b]||0;
    const p=prices[b]||0;
    totalCost+=p;
    if(p)hasPrices=true;
  }));
  return{counts,qty,totalW,totalCost,hasPrices};
}

function buildTable(counts,series,prices){
  let table='<table class="table"><tr><th>Bloczek</th><th>Ilość</th><th>Waga</th><th>Cena jedn.</th><th>Wartość</th></tr>';
  let totalVal=0,totalW=0;
  Object.keys(counts).sort((a,b)=>b-a).forEach(b=>{
    const w=(series.weights[b]||0)*counts[b];
    const val=(prices[b]||0)*counts[b];
    totalVal+=val;totalW+=w;
    table+=`<tr><td>${b} cm</td><td>${counts[b]}</td><td>${w.toFixed(1)} t</td><td class="price">${prices[b]?prices[b]+' zł':'—'}</td><td class="price">${val?val.toLocaleString('pl-PL')+' zł':'—'}</td></tr>`;
  });
  table+=`<tr class="total"><td colspan="2">RAZEM</td><td>${totalW.toFixed(1)} t</td><td></td><td>${totalVal?totalVal.toLocaleString('pl-PL')+' zł':'—'}</td></tr>`;
  return table+'</table>';
}

function setWarn(msg){
  const el=document.getElementById('warn');
  if(msg){el.textContent=msg;el.style.display='';}
  else el.style.display='none';
}

function runCalc(){
  const seriesKey=document.getElementById('series').value;
  const series=SERIES[seriesKey],shape=document.getElementById('shape').value;
  const raw=[+d0.value,+d1.value,+d2.value].map(v=>Math.round(v*100));
  const step=series.blocks.reduce((a,b)=>gcd(a,b));
  const prices=PRICES[seriesKey]||{};
  document.getElementById('plan3d-wrap').style.display='none';

  if(shape==='boksy'){
    const N=Math.max(1,parseInt(document.getElementById('nbox').value)||1);
    const W=raw[0],D=raw[1];
    const d=series.depth;
    const backLen=N*W+(N+1)*d;
    const issues=[];
    if(backLen%step!==0)        issues.push(`Tylna (pełna) ${(backLen/100).toFixed(2)} m poza modułem ${step} cm`);
    if((backLen-2*d)%step!==0)  issues.push(`Tylna (skrócona o 2×${d}cm) ${((backLen-2*d)/100).toFixed(2)} m poza modułem ${step} cm`);
    if(D%step!==0)              issues.push(`Głębokość boksu ${(D/100).toFixed(2)} m poza modułem ${step} cm`);
    if((D+d)%step!==0)          issues.push(`Głębokość boksu + grubość ściany ${((D+d)/100).toFixed(2)} m (naroże zewn.) poza modułem ${step} cm`);
    if(issues.length){
      setWarn('Uwaga: '+issues.join('; '));
      summary.innerHTML=`<div class="stat"><b>—</b><span>popraw wymiary</span></div>`;
      walls.innerHTML=`<p style="color:var(--muted);font-size:13px">${issues.join('<br>')}</p>`;
      return;
    }
    setWarn('');
    const withArch=document.getElementById('withArch')?.checked;
    const archPriceUnit=withArch?+(document.getElementById('archPrice')?.value||0):0;
    const H=+height.value;
    const courses=layoutBoksy(N,W,D,H,series);
    const {counts,qty,totalW,totalCost}=countBlocks(courses,series,seriesKey);
    const rows=Math.ceil(H*100/series.rowH);
    const actualH=(rows*series.rowH/100).toFixed(2);

    const mbPerRow=(backLen+(N+1)*D)/100;
    const mbTotal=(mbPerRow*rows).toFixed(1);
    const m3=(totalW/2.4).toFixed(1);

    // Łuk calculation
    const ARCH_INNER=ARCH.span-2*60; // 420 cm — inner span between legs
    let archQty=0,archCost=0,archWarnHtml='',archBlocked=false;
    if(withArch){
      if(series.depth!==60){
        archWarnHtml=`<div class="warn" style="margin-top:8px">⚠ Łuk dachowy jest dostępny tylko dla systemu LEGO 60</div>`;
        archBlocked=true;
      } else if(W!==ARCH_INNER){
        archWarnHtml=`<div class="warn" style="margin-top:8px">⚠ Dla łuku szerokość boksu musi wynosić dokładnie ${(ARCH_INNER/100).toFixed(2)} m (ustawiono ${(W/100).toFixed(2)} m)</div>`;
        archBlocked=true;
      }
      if(!archBlocked){
        const ac=parseInt(document.getElementById('archCount')?.value)||Math.ceil(D/ARCH.depth);
        archQty=N*ac;
        archCost=archQty*archPriceUnit;
      }
    }

    const totalMaterialCost=totalCost+(archCost||0);
    summary.style.gridTemplateColumns=`repeat(${withArch?8:6},1fr)`;
    summary.innerHTML=`
      <div class="stat"><b>${qty}</b><span>szt. bloczków</span></div>
      <div class="stat"><b>${totalW.toFixed(1)} t</b><span>waga łącznie</span></div>
      <div class="stat"><b>${m3} m³</b><span>kubatura betonu</span></div>
      <div class="stat"><b>${Math.ceil(totalW/27)}</b><span>kursy 27 t</span></div>
      <div class="stat"><b>${mbTotal} m</b><span>m.p. ścian</span></div>
      ${withArch?`<div class="stat"><b>${archQty}</b><span>łuków dachowych</span></div>`:''}
      <div class="stat cost"><b>${totalCost?totalCost.toLocaleString('pl-PL')+' zł':'—'}</b><span>cena bloczków</span></div>
      ${withArch?`<div class="stat cost"><b>${archCost?archCost.toLocaleString('pl-PL')+' zł':'—'}</b><span>cena łuków</span></div>`:''}`;

    const planWrap=document.getElementById('plan3d-wrap');
    planWrap.innerHTML=renderBoksyPlan(N,W,D,series);
    planWrap.style.display='';

    const boczne_mb=((N+1)*D/100).toFixed(2);
    const tylna_mb=(backLen/100).toFixed(2);
    const cornerNote=`naroże zewn.: ${(D/100).toFixed(2)} / ${((D+d)/100).toFixed(2)} m`;
    const tylnaCourses=courses.filter(c=>c.key==='Tylna');
    const boczna1=courses.filter(c=>c.key==='Boczna_1');

    const archSectionHtml=withArch?`
      <div class="wall">
        <h2>Łuk dachowy</h2>
        <div class="wall-note" style="line-height:1.8">
          <b>Element:</b> ${(ARCH.span/100).toFixed(2)} m rozpiętości × ${(ARCH.depth/100).toFixed(2)} m szer. × 0.60 m wys. &nbsp;|&nbsp;
          <b>Strzałka:</b> ${ARCH.rise} cm &nbsp;|&nbsp; <b>Krawędź:</b> ${ARCH.edgeH} cm<br>
          <b>Łuków / boks:</b> ${Math.ceil(D/(ARCH.depth*10))} szt. &nbsp;|&nbsp;
          <b>Łącznie (${N} boksów):</b> ${archQty} szt.<br>
          <b>Uwaga:</b> tylna ściana (Tylna) nie jest nakryta łukiem — należy domurować szczyt bloczkami
          wg profilu łuku (maks. strzałka ~${ARCH.rise} cm ponad poziom ścian bocznych).
        </div>
        ${archWarnHtml}
      </div>`:''

    walls.innerHTML=`
      <div class="wall-note" style="line-height:1.8">
        <b>Tylna:</b> ${tylna_mb} m &nbsp;|&nbsp;
        <b>Boczne (${N+1} szt.):</b> ${boczne_mb} m łącznie &nbsp;|&nbsp;
        ${cornerNote}<br>
        <b>Razem / rząd:</b> ${mbPerRow.toFixed(2)} m &nbsp;|&nbsp;
        <b>Razem wszystkie rzędy (×${rows}):</b> ${mbTotal} m &nbsp;|&nbsp;
        <b>h:</b> ${actualH} m
      </div>
      ${renderWall('Tylna (pełna długość)',tylnaCourses,series)}
      ${renderWall(`Boczna (×${N+1} szt.)`,boczna1,series)}
      ${buildTable(counts,series,prices)}
      ${archSectionHtml}`;

    render3d(shape,courses,series,N,W,D,null,H);
    return;
  }

  // --- prosta / L / U ---
  const withArchU=shape==='U'&&(document.getElementById('withArch')?.checked);
  const archPriceUnitU=withArchU?+(document.getElementById('archPrice')?.value||0):0;

  summary.style.gridTemplateColumns='';
  const rawBad=raw.filter((v,i)=>shape==='prosta'?i===0:shape==='L'?i<2:true).filter(v=>v%step!==0);
  const courseBad=courseLengthIssues(shape,raw,series,step);
  if(rawBad.length||courseBad.length){
    setWarn(`Uwaga: wymiar albo odcinek po złożeniu narożnika nie leży w module ${step} cm. Skoryguj wymiar.`);
  } else {
    setWarn('');
  }
  showFixes(raw,shape,step);
  if(courseBad.length)fixes.innerHTML+=`<div class="fix"><div class="fix-title">Odcinki poza modułem: ${courseBad.join(', ')}</div></div>`;
  if(rawBad.length||courseBad.length){
    summary.innerHTML=`<div class="stat"><b>—</b><span>popraw wymiary</span></div><div class="stat"><b>${step} cm</b><span>moduł</span></div>`;
    walls.innerHTML='<div style="color:var(--muted);font-size:13px">Wybierz korektę wymiaru po lewej stronie.</div>';
    if(renderer){meshes.forEach(m=>{scene.remove(m);m.geometry.dispose();m.material.dispose()});meshes=[];}
    return;
  }
  const courses=layout(shape,raw,+height.value,series);
  const {counts,qty,totalW,totalCost}=countBlocks(courses,series,seriesKey);

  // Arch for U-shape: arch spans Tylna (raw[1]), multiple arches along Lewa depth (raw[0])
  let uArchQty=0,uArchCost=0,uArchWarnHtml='',uArchSectionHtml='',uArchBlocked=false;
  if(withArchU){
    if(series.depth!==60){
      uArchWarnHtml=`<div class="warn" style="margin-top:8px">⚠ Łuk dachowy jest dostępny tylko dla systemu LEGO 60</div>`;
      uArchBlocked=true;
    } else if(raw[1]!==ARCH.span){
      uArchWarnHtml=`<div class="warn" style="margin-top:8px">⚠ Dla łuku ściana Tylna musi mieć dokładnie ${(ARCH.span/100).toFixed(2)} m (masz ${(raw[1]/100).toFixed(2)} m)</div>`;
      uArchBlocked=true;
    }
    if(!uArchBlocked){
      const ac=parseInt(document.getElementById('archCount')?.value)||Math.ceil(raw[0]/ARCH.depth);
      uArchQty=ac;
      uArchCost=uArchQty*archPriceUnitU;
    }
    uArchSectionHtml=`
      <div class="wall">
        <h2>Łuk dachowy</h2>
        <div class="wall-note" style="line-height:1.8">
          <b>Element:</b> ${(ARCH.span/100).toFixed(2)} m rozpiętości × ${(ARCH.depth/100).toFixed(2)} m szer. × 0.60 m wys. &nbsp;|&nbsp;
          <b>Strzałka:</b> ${ARCH.rise} cm &nbsp;|&nbsp; <b>Krawędź:</b> ${ARCH.edgeH} cm<br>
          <b>Łuków na głębokość ${(raw[0]/100).toFixed(2)} m:</b> ${uArchQty} szt.<br>
          <b>Uwaga:</b> tylna ściana (Tylna) nie jest nakryta łukiem — należy domurować szczyt
          bloczkami wg profilu łuku (maks. ~${ARCH.rise} cm ponad poziom ścian bocznych).
        </div>
        ${uArchWarnHtml}
      </div>`;
  }

  summary.style.gridTemplateColumns=withArchU?'repeat(6,1fr)':'';
  summary.innerHTML=`
    <div class="stat"><b>${qty}</b><span>szt. bloczków</span></div>
    <div class="stat"><b>${totalW.toFixed(1)} t</b><span>waga</span></div>
    <div class="stat"><b>${Math.ceil(totalW/27)}</b><span>kursy 27 t</span></div>
    ${withArchU?`<div class="stat"><b>${uArchQty}</b><span>łuków dachowych</span></div>`:''}
    <div class="stat cost"><b>${totalCost?totalCost.toLocaleString('pl-PL')+' zł':'—'}</b><span>cena bloczków</span></div>
    ${withArchU?`<div class="stat cost"><b>${uArchCost?uArchCost.toLocaleString('pl-PL')+' zł':'—'}</b><span>cena łuków</span></div>`:''}`;
  const groups=[...new Set(courses.map(c=>c.key))];
  walls.innerHTML=groups.map(g=>renderWall(g,courses.filter(c=>c.key===g),series)).join('')+buildTable(counts,series,prices)+uArchSectionHtml;
  render3d(shape,courses,series,0,0,0,raw,+height.value);
}

onShapeChange(); // initialize boksy mode on load
</script>
