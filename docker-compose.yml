services:
  rcm-erp:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data     # persystencja bazy SQLite
    environment:
      - DATABASE_URL=sqlite:////app/data/factoryflow_demo.db
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET before running}
    # Run migrations then start the server — same pattern as render.yaml
    command: >
      sh -c "cd /app && python -m alembic upgrade head &&
             cd /app/backend && python -m uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

# Pierwsze uruchomienie:
#   export JWT_SECRET=<losowy-secret>
#   docker compose up -d
# Migracje uruchamiane automatycznie przy starcie kontenera (alembic upgrade head).
# Dostęp z sieci biura:
#   http://192.168.1.15:8000
