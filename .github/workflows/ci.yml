name: FactoryFlow backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - run: python -m pip install -r requirements.txt
      - name: Bootstrap a fresh PostgreSQL database
        run: |
          docker compose up -d --wait db
          docker compose --profile setup run --build --rm bootstrap
          docker compose up -d --build --wait api
      - name: Install PDF text verifier
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify native workflows and isolation
        run: |
          python demo/verify_fixtures.py
          python demo/verify_documents.py
          python demo/verify.py
      - name: Verify persistence after restart and repeated bootstrap
        run: |
          docker compose stop api
          docker compose --profile setup run --rm bootstrap
          docker compose up -d --wait api
          python demo/verify.py --after-restart
          python demo/verify_fixtures.py --compare
      - name: Calculation parity
        working-directory: dotnet
        run: |
          dotnet restore Rcm.Calculators.Tests --locked-mode
          dotnet test Rcm.Calculators.Tests -c Release --no-restore
          dotnet restore Rcm.Orders.Tests --locked-mode
          dotnet test Rcm.Orders.Tests -c Release --no-restore
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable test containers
        if: always()
        run: docker compose down -v
  legacy-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the independent legacy profile
        run: docker compose --profile legacy build legacy
