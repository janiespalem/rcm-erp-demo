name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Build Vite frontend
        # tests/test_build.py always checks for frontend-vite/dist/index.html
        run: cd frontend-vite && npm ci && npm run build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # WeasyPrint requires GTK/Cairo — exclude it in CI (pdf_gen handles missing import gracefully)
        run: |
          grep -vE '^weasyprint|^pydyf' requirements.txt > /tmp/ci-req.txt
          pip install -r /tmp/ci-req.txt -r requirements-dev.txt

      - name: Run tests
        env:
          APP_ENV: test
          DISABLE_STARTUP_SEED: "1"
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Build Vite frontend
        run: cd frontend-vite && npm ci && npm run build

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          grep -vE '^weasyprint|^pydyf' requirements.txt > /tmp/ci-req.txt
          pip install -r /tmp/ci-req.txt

      - name: Verify alembic upgrade head on fresh SQLite
        env:
          DATABASE_URL: sqlite:////tmp/ci_migration_test.db
        run: python -m alembic upgrade head
